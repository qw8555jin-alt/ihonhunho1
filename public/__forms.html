<!DOCTYPE html>
<html>
  <head>
    <title>Netlify Forms</title>
  </head>
  <body>
    <!-- This file is for Netlify's build bots to scrape the form structure. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input type="text" name="사무실명" />
      <input type="radio" name="과거 숏폼 진행여부" value="O" />
      <input type="radio" name="과거 숏폼 진행여부" value="X" />
      <input type="radio" name="현재 운영중인 채널 여부" value="운영 중" />
      <input type="radio" name="현재 운영중인 채널 여부" value="미운영" />
      <input type="date" name="희망 시작일" />
      <select name="원하는 영상의 개수"></select>
      <select name="예상 월 예산"></select>
      <input type="email" name="연락 받으실 이메일" />
      <select name="현재 월평균 수임 건수"></select>
      <select name="이혼 소송 평균 착수금 대역"></select>
      <input type="text" name="사무실 위치" />
      <textarea name="문의사항"></textarea>
      <input type="checkbox" name="개인정보_수집_동의" />
    </form>
  </body>
</html>
